<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>함께 배움터 — 특수교육 통합 체험형 학습 앱</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #EEF2F5;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.45); }
      50% { transform: scale(1.025); box-shadow: 0 0 0 14px rgba(15, 118, 110, 0); }
    }
    .hint-pulse {
      animation: gentlePulse 1.3s infinite;
      border-color: #0F766E !important;
      background-color: #CCFBF1 !important;
    }
    @keyframes popIn {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: popIn 0.22s ease-out forwards;
    }
    .tap-target {
      min-height: 64px;
      touch-action: manipulation;
      user-select: none;
    }
    canvas.trace-canvas {
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body class="min-h-screen lg:h-screen lg:overflow-hidden flex flex-col">

  <!-- 1. TOP BAR -->
  <header class="shrink-0 bg-white border-b-2 border-slate-200 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <button id="btn-home" class="tap-target flex items-center gap-3 px-3 py-1.5 rounded-2xl hover:bg-slate-100 transition text-left" title="처음 화면으로">
          <span class="w-11 h-11 rounded-2xl bg-teal-700 text-white flex items-center justify-center text-2xl font-black shadow-sm">배</span>
          <div>
            <div class="text-xl font-black tracking-tight text-slate-900 leading-tight">함께 배움터</div>
            <div class="text-xs font-bold text-slate-500">특수교육 통합 체험 학습</div>
          </div>
        </button>
      </div>

      <!-- Center Game Progress -->
      <div id="top-game-status" class="hidden flex-1 max-w-md mx-4">
        <div class="flex items-center justify-between text-sm font-black text-slate-700 mb-1.5">
          <span id="top-badge" class="px-3 py-0.5 rounded-lg bg-teal-700 text-white text-xs"></span>
          <span id="top-step-label"></span>
        </div>
        <div class="w-full h-3.5 bg-slate-200 rounded-full overflow-hidden">
          <div id="top-progress-bar" class="h-full bg-teal-600 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Right Controls -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5 bg-amber-100 border-2 border-amber-300 px-3.5 py-2 rounded-2xl text-amber-950 font-black text-base">
          <span>⭐</span>
          <span>별</span>
          <span id="star-count" class="text-lg text-amber-800">0</span>
        </div>

        <button id="toggle-tts" class="tap-target px-3.5 py-2 rounded-2xl border-2 border-slate-300 bg-white hover:bg-slate-50 text-sm font-black flex items-center gap-1.5 transition" aria-pressed="true">
          <span id="tts-icon">🔊</span>
          <span id="tts-label">음성 켜짐</span>
        </button>

        <button id="toggle-sfx" class="tap-target px-3.5 py-2 rounded-2xl border-2 border-slate-300 bg-white hover:bg-slate-50 text-sm font-black flex items-center gap-1.5 transition" aria-pressed="true">
          <span id="sfx-icon">🎵</span>
          <span id="sfx-label">효과음</span>
        </button>

        <button id="toggle-teacher" class="tap-target px-4 py-2 rounded-2xl border-2 border-teal-700 bg-teal-50 text-teal-950 hover:bg-teal-100 text-sm font-black flex items-center gap-1.5 transition">
          <span>⚙️</span>
          <span>교사 설정</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. CENTER STAGE -->
  <main id="app-root" class="flex-1 overflow-y-auto px-4 lg:px-8 py-3 lg:py-4 flex flex-col"></main>

  <!-- 3. BOTTOM ERGONOMIC STUDENT DOCK -->
  <footer id="bottom-dock" class="hidden shrink-0 bg-white border-t-2 border-slate-200 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <button id="btn-back-hub" class="tap-target px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 font-black text-base lg:text-lg text-slate-900 flex items-center gap-2 transition">
          <span>←</span>
          <span>과목 화면</span>
        </button>
        <button id="btn-back-menu" class="tap-target px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 font-black text-base lg:text-lg text-slate-900 flex items-center gap-2 transition">
          <span>📋</span>
          <span>활동 목록</span>
        </button>
      </div>

      <div class="flex items-center gap-3">
        <button id="btn-replay-voice" class="tap-target px-6 py-3 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white font-black text-base lg:text-lg flex items-center gap-2 shadow-sm transition">
          <span>🔊</span>
          <span>다시 듣기</span>
        </button>
        <button id="btn-show-hint" class="tap-target px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-base lg:text-lg flex items-center gap-2 shadow-sm transition">
          <span>💡</span>
          <span>힌트 보기</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- Teacher Settings Modal -->
  <div id="teacher-panel" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border-4 border-teal-700 max-w-xl w-full p-6 sm:p-8 shadow-2xl pop-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-2xl font-black text-slate-900">교사용 학생 맞춤 설정</h2>
          <p class="text-sm text-slate-600 mt-0.5">전자칠판 수업 중 학생 특성에 맞게 즉시 조절하세요.</p>
        </div>
        <button id="btn-close-teacher" class="tap-target px-4 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 font-black text-slate-800">
          닫기 ✕
        </button>
      </div>

      <div class="space-y-3 mb-6">
        <label class="flex items-center justify-between p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 cursor-pointer">
          <span class="font-black text-base text-slate-900">오류 없는 학습 (오답 벌칙 없음)</span>
          <input type="checkbox" id="opt-errorless" checked class="w-6 h-6 accent-teal-700" />
        </label>
        <label class="flex items-center justify-between p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 cursor-pointer">
          <span class="font-black text-base text-slate-900">자동 시각 힌트 강조</span>
          <input type="checkbox" id="opt-autohint" checked class="w-6 h-6 accent-teal-700" />
        </label>
        <label class="flex items-center justify-between p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 cursor-pointer">
          <span class="font-black text-base text-slate-900">초대형 큰 글씨 모드</span>
          <input type="checkbox" id="opt-bigtext" class="w-6 h-6 accent-teal-700" />
        </label>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-200">
        <button id="btn-reset-progress" class="tap-target px-5 py-2.5 rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-900 font-black text-sm transition">
          모은 별 · 완료 기록 초기화
        </button>
        <button id="btn-done-teacher" class="tap-target px-6 py-2.5 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-black text-base transition">
          적용 완료
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Banner -->
  <div id="toast-box" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-3">
    <div id="toast-msg" class="px-7 py-4 rounded-2xl shadow-xl font-black text-xl bg-slate-900 text-white flex items-center gap-2 border-2 border-white/20"></div>
  </div>

<script>
(function() {
  // ==========================================
  // 1. STATE, SHUFFLE & AUDIO / TTS ENGINE
  // ==========================================
  const SESSION_LIMIT = 10;

  const state = {
    view: 'hub', // 'hub' | 'subjectMenu' | 'game' | 'complete'
    selectedLevel: 1,
    currentSubject: null,
    currentLevel: 1,
    currentActivityIndex: 0,
    sessionRounds: [],
    sessionTraceResults: [],
    roundIndex: 0,
    stars: 0,
    completedGames: {},
    ttsEnabled: true,
    sfxEnabled: true,
    errorlessMode: true,
    autoHintMode: true,
    bigTextMode: false,
    gameData: {}
  };

  try {
    const saved = localStorage.getItem('special_ed_app_v3');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (typeof parsed.stars === 'number') state.stars = parsed.stars;
      if (parsed.completedGames) state.completedGames = parsed.completedGames;
    }
  } catch (e) {}

  function saveProgress() {
    try {
      localStorage.setItem('special_ed_app_v3', JSON.stringify({
        stars: state.stars,
        completedGames: state.completedGames
      }));
    } catch (e) {}
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Visual helper: renders either concrete color swatch SVG or crisp emoji
  function renderVisual(vis, sizeClass = 'text-6xl') {
    if (typeof vis === 'string' && vis.startsWith('swatch:')) {
      const hex = vis.split(':')[1];
      return `<span class="inline-flex items-center justify-center w-12 h-12 rounded-full border-4 border-slate-800 shadow-sm" style="background-color:${hex}"></span>`;
    }
    if (typeof vis === 'string' && vis.startsWith('size:')) {
      const mode = vis.split(':')[1];
      if (mode === 'big') {
        return `<span class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-rose-200 border-4 border-rose-700 font-black text-rose-950 text-lg">큰</span>`;
      }
      return `<span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-rose-100 border-2 border-rose-600 font-black text-rose-900 text-xs">작은</span>`;
    }
    return `<span class="${sizeClass} leading-none">${vis}</span>`;
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playSfx(type) {
    if (!state.sfxEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'success') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.09);
      osc.frequency.setValueAtTime(783.99, now + 0.18);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.46);
    } else if (type === 'tap') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.11);
    } else if (type === 'nudge') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(330, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.15, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.36);
      });
    }
  }

  function speak(text) {
    if (!state.ttsEnabled || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.9;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  let toastTimer = null;
  function showToast(msg, tone = 'dark') {
    const box = document.getElementById('toast-box');
    const el = document.getElementById('toast-msg');
    el.textContent = msg;
    el.className = 'px-7 py-4 rounded-2xl shadow-xl font-black text-xl flex items-center gap-2 border-2 border-white/20 ' +
      (tone === 'success' ? 'bg-teal-700 text-white' :
       tone === 'warn' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-white');
    box.classList.remove('opacity-0', '-translate-y-3');
    box.classList.add('opacity-100', 'translate-y-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      box.classList.add('opacity-0', '-translate-y-3');
      box.classList.remove('opacity-100', 'translate-y-0');
    }, 2000);
  }

  // ==========================================
  // 2. CURRICULUM METADATA
  // ==========================================
  const SUBJECTS = [
    {
      id: 'korean',
      name: '국어',
      subtitle: '읽기 · 쓰기 · 어휘 · 소통',

      badge: 'bg-teal-700 text-white',
      btn: 'bg-teal-700 hover:bg-teal-800 text-white'
    },
    {
      id: 'social',
      name: '사회',
      subtitle: '안전 · 지역사회 · 교통 · 예절',
      icon: '🏘️',
      cardStyle: 'bg-white border-sky-300',
      iconBg: 'bg-sky-100',
      badge: 'bg-sky-700 text-white',
      btn: 'bg-sky-700 hover:bg-sky-800 text-white'
    },
    {
      id: 'career',
      name: '진로와직업',
      subtitle: '도구 · 작업 순서 · 직장 예절',
      icon: '🧰',
      cardStyle: 'bg-white border-violet-300',
      iconBg: 'bg-violet-100',
      badge: 'bg-violet-700 text-white',
      btn: 'bg-violet-700 hover:bg-violet-800 text-white'

  const LEVEL_INFO = {
    1: { name: '1수준 · 감각·기초', desc: '큰 그림 · 따라 그리기 · 기초 10단계' },
    2: { name: '2수준 · 생활·적용', desc: '형용사·시제 읽기 · 화폐 · 10단계' },
    3: { name: '3수준 · 문제해결·자립', desc: '육하원칙 · 키오스크 · 시뮬레이션 10단계' }
  };

  // ==========================================
  // 3. 48 PLAYABLE ACTIVITIES (4×3×4, 10 RANDOMIZED ROUNDS EACH)
  // ==========================================
  const ACTIVITIES = {
    'korean-1': [
      {
        title: '칸 나누어 기초 문장 읽기',
        tag: '기초 읽기',
        icon: '📖',
        desc: '주어·목적어·서술어 3칸을 하나씩 누르며 10가지 문장을 읽어요.',
        engine: 'readChunk',
        rounds: [
          { prompt: '세 칸을 차례대로 누르며 읽어 보세요!', praise: '참 잘했어요! "민수가 사과를 먹어요" 완성!', chunks: [
            { role: '누가 (주어)', color: 'sky', emoji: '👦', text: '민수가' },
            { role: '무엇을 (목적어)', color: 'amber', emoji: '🍎', text: '사과를' },
            { role: '어떻게 (서술어)', color: 'teal', emoji: '😋', text: '먹어요' }
          ]},
          { prompt: '강아지가 무엇을 하는지 읽어 보세요!', praise: '잘 읽었어요! "강아지가 공을 굴려요"!', chunks: [
            { role: '누가 (주어)', color: 'sky', emoji: '🐶', text: '강아지가' },
            { role: '무엇을 (목적어)', color: 'amber', emoji: '⚽', text: '공을' },
            { role: '어떻게 (서술어)', color: 'teal', emoji: '💨', text: '굴려요' }
          ]},
          { prompt: '지은이가 무엇을 마시는지 읽어 보세요!', praise: '최고예요! "지은이가 우유를 마셔요"!', chunks: [
            { role: '누가 (주어)', color: 'sky', emoji: '👧', text: '지은이가' },
            { role: '무엇을 (목적어)', color: 'amber', emoji: '🥛', text: '우유를' },
            { role: '어떻게 (서술어)', color: 'teal', emoji: '🥤', text: '마셔요' }
          ]},
          { prompt: '엄마가 무엇을 하시는지 읽어 보세요!', praise: '정확해요! "엄마가 빵을 구워요"!', chunks: [
            { role: '누가 (주어)', color: 'sky', emoji: '👩', text: '엄마가' },
            { role: '무엇을 (목적어)', color: 'amber', emoji: '🥐', text: '빵을' },
            { role: '어떻게 (서술어)', color: 'teal', emoji: '🔥', text: '구워요' }
          ]},
          { prompt: '아빠가 무엇을 타시는지 읽어 보세요!', praise: '멋져요! "아빠가 버스를 타요"!', chunks: [
            { role: '누가 (주어)', color: 'sky', emoji: '👨', text: '아빠가' },
            { role: '무엇을 (목적어)', color: 'amber', emoji: '🚌', text: '버스를' },

          ]},
          { prompt: '고양이가 무엇을 하는지 읽어 보세요!', praise: '아주 좋아요! "고양이가 잠을 자요"!', chunks: [

          { prompt: '동생이 무엇을 그리는지 읽어 보세요!', praise: '훌륭해요! "동생이 꽃을 그려요"!', chunks: [

            { role: '무엇을 (목적어)', color: 'amber', emoji: '🌸', text: '꽃을' },

          { prompt: '일터의 물건을 아껴 쓰고 제자리에 두는 태도는?', praise: '알뜰하고 바른 태도예요! 모두 함께 쓰는 물건을 소중히 해요.', target: 'care2', options: [{ id: 'care2', emoji: '🧰', label: '물건을 소중히 아껴 쓰기' }, { id: 'break', emoji: '💥', label: '함부로 던지고 망가뜨리기' }] },

  // ==========================================
  // 4. DYNAMIC 10-ROUND BUILDERS FOR PROCEDURAL GAMES
  // ==========================================
  function buildSessionRounds(act) {
    if (act.engine === 'basket') {
      const fruits = [
        { e: '🍎', n: '사과' }, { e: '🍊', n: '귤' }, { e: '🍓', n: '딸기' },
        { e: '🍌', n: '바나나' }, { e: '🍇', n: '포도' }, { e: '🍑', n: '복숭아' },
        { e: '🍉', n: '수박' }, { e: '🍐', n: '배' }, { e: '🥝', n: '키위' }, { e: '🍒', n: '체리' }
      ];
      const counts = shuffleArray([1, 2, 3, 4, 5, 2, 3, 4, 5, 6]);
      return shuffleArray(fruits).slice(0, SESSION_LIMIT).map((f, i) => ({
        itemEmoji: f.e,
        itemName: f.n,
        targetCount: counts[i],
        prompt: `바구니에 ${f.n} ${counts[i]}개를 담아 보세요!`,
        praise: `정확해요! ${f.n} ${counts[i]}개를 아주 잘 세어 담았어요!`
      }));
    }

    if (act.engine === 'payment') {
      const goods = [
        { e: '🥛', n: '우유', p: 1500 }, { e: '🥐', n: '소금빵', p: 2200 },
        { e: '🍙', n: '삼각김밥', p: 1300 }, { e: '🧃', n: '사과주스', p: 1100 },
        { e: '🍞', n: '식빵', p: 2500 }, { e: '🍌', n: '바나나', p: 1800 },
        { e: '🍦', n: '아이스크림', p: 1200 }, { e: '🥪', n: '샌드위치', p: 2700 },
        { e: '🍪', n: '초코쿠키', p: 1600 }, { e: '🍎', n: '사과', p: 2100 }
      ];
      return shuffleArray(goods).slice(0, SESSION_LIMIT).map(g => ({
        itemEmoji: g.e,
        itemName: g.n,
        price: g.p,
        prompt: `${g.p.toLocaleString()}원짜리 ${g.n}을(를) 사기 위해 알맞은 돈을 내세요.`,
        praise: `계산 천재! ${g.p.toLocaleString()}원을 딱 맞게 지불했어요!`
      }));
    }

    if (act.engine === 'clock') {
      const schedules = [
        { h: 7, label: '아침 7시 (일어나는 시간)' },
        { h: 8, label: '오전 8시 (아침밥 먹는 시간)' },
        { h: 9, label: '오전 9시 (학교 등교 시간)' },
        { h: 10, label: '오전 10시 (쉬는 시간)' },
        { h: 11, label: '오전 11시 (미술 시간)' },
        { h: 12, label: '낮 12시 (점심 급식 시간)' },
        { h: 1, label: '오후 1시 (책 읽는 시간)' },
        { h: 2, label: '오후 2시 (방과후 시간)' },
        { h: 3, label: '오후 3시 (집에 가는 시간)' },
        { h: 6, label: '저녁 6시 (저녁밥 시간)' }
      ];
      return shuffleArray(schedules).slice(0, SESSION_LIMIT).map(sc => ({
        prompt: `"${sc.label}"에 맞게 시계 바늘을 돌려 보세요.`,
        praise: `딩동댕! ${sc.h}시 정각을 아주 정확하게 맞췄어요!`,
        targetHour: sc.h
      }));
    }

    if (act.engine === 'budget') {
      const allSnacks = [
        { id: 'bread', emoji: '🍞', name: '식빵', price: 1500 },
        { id: 'juice', emoji: '🧃', name: '주스', price: 1000 },
        { id: 'cake', emoji: '🍰', name: '케이크', price: 2800 },
        { id: 'milk', emoji: '🥛', name: '우유', price: 1200 },
        { id: 'cookie', emoji: '🍪', name: '쿠키', price: 1400 },
        { id: 'ice', emoji: '🍦', name: '아이스크림', price: 1100 },
        { id: 'apple', emoji: '🍎', name: '사과', price: 1300 },
        { id: 'sand', emoji: '🥪', name: '샌드위치', price: 2400 }
      ];
      const budgets = [2500, 3000, 3200, 3500, 4000, 2800, 3300, 3600, 4200, 3800];
      return shuffleArray(budgets).slice(0, SESSION_LIMIT).map(b => ({
        prompt: `용돈 ${b.toLocaleString()}원 안에서 간식 2가지 이상을 골라 장바구니에 담으세요.`,
        praise: `알뜰한 소비왕! ${b.toLocaleString()}원 예산 안에서 잘 골랐어요!`,
        budget: b,
        items: shuffleArray(allSnacks).slice(0, 4)
      }));
    }

    if (act.engine === 'world3d') {
      return act.rounds.slice(0, 1);
    }
    if (act.engine === 'kiosk') {
      const menus = ['우유', '딸기주스', '아이스티', '초코라떼'];
      const temps = ['따뜻하게', '시원하게'];
      const packs = ['매장 식사', '포장하기'];
      const combos = [];
      menus.forEach(m => temps.forEach(t => packs.forEach(p => combos.push({ m, t, p }))));
      return shuffleArray(combos).slice(0, SESSION_LIMIT).map(c => ({
        mission: `미션: "${c.t.replace('하게','한')} ${c.m} 1잔"을 "${c.p}"로 주문하세요.`,
        praise: `주문이 완벽하게 들어갔어요! ${c.m} 키오스크 주문 성공!`,
        targetMenu: c.m,
        targetTemp: c.t,
        targetPack: c.p
      }));
    }

    // For choice / trace / readChunk / sequence: shuffle and take up to SESSION_LIMIT (10)
    return shuffleArray(act.rounds).slice(0, SESSION_LIMIT);
  }

  // ==========================================
  // 5. RENDER ROUTER & SHELL CONTROL
  // ==========================================
  const root = document.getElementById('app-root');
  const topStatus = document.getElementById('top-game-status');
  const bottomDock = document.getElementById('bottom-dock');

  function getCurrentActivity() {
    const list = ACTIVITIES[`${state.currentSubject}-${state.currentLevel}`] || [];
    return list[state.currentActivityIndex];
  }

  function getCurrentRound() {
    return state.sessionRounds[state.roundIndex] || null;
  }

  function getCurrentPromptText() {
    const r = getCurrentRound();
    if (!r) return '';
    return r.prompt || r.mission || '';
  }

  function updateHeader() {
    document.getElementById('star-count').textContent = state.stars;
    document.body.classList.toggle('text-lg', state.bigTextMode);

    const ttsBtn = document.getElementById('toggle-tts');
    document.getElementById('tts-icon').textContent = state.ttsEnabled ? '🔊' : '🔇';
    document.getElementById('tts-label').textContent = state.ttsEnabled ? '음성 켜짐' : '음성 꺼짐';
    ttsBtn.setAttribute('aria-pressed', String(state.ttsEnabled));

    const sfxBtn = document.getElementById('toggle-sfx');
    document.getElementById('sfx-icon').textContent = state.sfxEnabled ? '🎵' : '🔕';
    document.getElementById('sfx-label').textContent = state.sfxEnabled ? '효과음' : '무음';
    sfxBtn.setAttribute('aria-pressed', String(state.sfxEnabled));

    if (state.view === 'game') {
      const sub = SUBJECTS.find(x => x.id === state.currentSubject);
      const act = getCurrentActivity();
      const total = state.sessionRounds.length || 1;
      const pct = Math.round(((state.roundIndex + 1) / total) * 100);
      topStatus.classList.remove('hidden');
      bottomDock.classList.remove('hidden');
      document.getElementById('top-badge').textContent = `${sub.name} ${state.currentLevel}수준 · ${act.title}`;
      document.getElementById('top-step-label').textContent = `${state.roundIndex + 1} / ${total} 단계`;
      document.getElementById('top-progress-bar').style.width = `${pct}%`;
    } else {
      topStatus.classList.add('hidden');
      bottomDock.classList.add('hidden');
    }
  }

  let world3DCleanup = null;
  function render() {
    if (world3DCleanup && state.view !== 'game') { world3DCleanup(); world3DCleanup = null; }
    updateHeader();
    if (state.view === 'hub') {
      renderHub();
    } else if (state.view === 'subjectMenu') {
      renderSubjectMenu();
    } else if (state.view === 'game') {
      renderGameShell();
    } else if (state.view === 'complete') {
      renderComplete();
    }
  }

  // ==========================================
  // 6. HUB VIEW
  // ==========================================
  function renderHub() {
    const levelTabs = [1, 2, 3].map(lvl => {
      const active = state.selectedLevel === lvl;
      return `
        <button data-select-level="${lvl}" class="tap-target flex-1 px-5 py-3.5 rounded-2xl border-4 text-left transition ${

            ? 'border-teal-800 bg-teal-700 text-white shadow-md'
            : 'border-slate-300 bg-white hover:border-teal-500 text-slate-900'
        }">
          <div class="font-black text-lg lg:text-xl">${LEVEL_INFO[lvl].name}</div>
          <div class="text-xs lg:text-sm font-bold mt-0.5 ${active ? 'text-teal-100' : 'text-slate-600'}">${LEVEL_INFO[lvl].desc}</div>
        </button>
      `;
    }).join('');

    const cards = SUBJECTS.map(sub => {
      const list = ACTIVITIES[`${sub.id}-${state.selectedLevel}`] || [];
      const doneCount = list.filter((_, i) => state.completedGames[`${sub.id}-${state.selectedLevel}-${i}`]).length;
      return `

              <span class="w-14 h-14 rounded-2xl ${sub.iconBg} flex items-center justify-center text-3xl shrink-0">${sub.icon}</span>
              <div>
                <h2 class="text-2xl lg:text-3xl font-black tracking-tight text-slate-900">${sub.name}</h2>
                <p class="text-sm font-bold text-slate-600">${sub.subtitle}</p>
              </div>
            </div>
            <span class="px-3 py-1.5 rounded-full ${doneCount === list.length ? 'bg-amber-300 text-amber-950' : 'bg-slate-100 text-slate-700'} text-sm font-black shrink-0">
              ⭐ ${doneCount} / ${list.length} 완료
            </span>
          </div>

          <div class="my-3 bg-slate-50 rounded-2xl p-3 border-2 border-slate-200">
            <div class="text-xs font-black text-slate-500 mb-1.5">${state.selectedLevel}수준 체험 활동 (${list.length}종 · 각 10단계 랜덤)</div>
            <div class="flex flex-wrap gap-1.5">
              ${list.map(a => `<span class="px-2.5 py-1 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-800">${a.icon} ${a.title}</span>`).join('')}
            </div>
          </div>

          <button data-open-subject="${sub.id}" class="tap-target w-full py-3.5 px-5 rounded-2xl font-black text-lg shadow-sm transition flex items-center justify-center gap-2 ${sub.btn}">
            <span>활동 고르기</span>
            <span>→</span>
          </button>
        </article>
      `;
    }).join('');

    root.innerHTML = `
      <section class="max-w-7xl w-full mx-auto my-auto pop-in">
        <div class="mb-3">
          <h1 class="text-2xl lg:text-3xl font-black text-slate-900">오늘은 어떤 과목을 체험해 볼까요?</h1>
          <p class="text-slate-600 text-base font-medium">수준을 고른 뒤 과목을 누르면 4가지 체험 활동(각 10단계 랜덤)을 선택할 수 있어요.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4" role="tablist" aria-label="학습 수준 선택">
          ${levelTabs}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-5">
          ${cards}
        </div>
      </section>
    `;

    root.querySelectorAll('[data-select-level]').forEach(btn => {
      btn.addEventListener('click', () => {
        playSfx('tap');
        state.selectedLevel = Number(btn.getAttribute('data-select-level'));
        speak(`${state.selectedLevel}수준을 선택했어요.`);
        render();
      });
    });

    root.querySelectorAll('[data-open-subject]').forEach(btn => {
      btn.addEventListener('click', () => {
        playSfx('tap');
        state.currentSubject = btn.getAttribute('data-open-subject');
        state.currentLevel = state.selectedLevel;
        state.view = 'subjectMenu';
        const sub = SUBJECTS.find(x => x.id === state.currentSubject);

  // ==========================================
  // 6B. SUBJECT ACTIVITY MENU VIEW (4 Cards)
  // ==========================================
  function renderSubjectMenu() {
    const sub = SUBJECTS.find(x => x.id === state.currentSubject);
    const list = ACTIVITIES[`${state.currentSubject}-${state.currentLevel}`] || [];

    const actCards = list.map((act, idx) => {
      const isDone = !!state.completedGames[`${state.currentSubject}-${state.currentLevel}-${idx}`];
      return `
        <article class="bg-white rounded-3xl border-4 border-slate-300 hover:border-teal-600 p-5 flex flex-col justify-between shadow-sm transition">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="px-3 py-1 rounded-xl text-xs font-black ${sub.badge}">${act.tag}</span>
              ${isDone ? '<span class="px-3 py-1 rounded-full bg-amber-300 text-amber-950 text-xs font-black">⭐ 완료</span>' : '<span class="text-xs font-bold text-slate-500">10단계 랜덤</span>'}
            </div>
            <div class="text-5xl mb-3">${act.icon}</div>

            <p class="text-sm lg:text-base font-medium text-slate-600">${act.desc}</p>
          </div>

          <button data-start-act="${idx}" class="tap-target mt-5 w-full py-3.5 px-5 rounded-2xl font-black text-lg shadow-sm transition flex items-center justify-center gap-2 ${sub.btn}">

            <span>→</span>
          </button>
        </article>
      `;
    }).join('');

    root.innerHTML = `
      <section class="max-w-7xl w-full mx-auto my-auto pop-in flex flex-col justify-between gap-5">
        <div class="flex flex-wrap items-center justify-between gap-4 bg-white rounded-3xl border-2 border-slate-200 p-5">
          <div class="flex items-center gap-4">
            <span class="w-16 h-16 rounded-2xl ${sub.iconBg} flex items-center justify-center text-4xl">${sub.icon}</span>
            <div>
              <div class="text-sm font-black text-teal-700">${LEVEL_INFO[state.currentLevel].name}</div>
              <h1 class="text-2xl lg:text-3xl font-black text-slate-900">${sub.name} 활동 고르기 (${list.length}가지)</h1>
            </div>
          </div>

          <button id="btn-menu-back" class="tap-target px-6 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 font-black text-lg text-slate-900">

          </button>

          ${actCards}

      </section>

    document.getElementById('btn-menu-back').addEventListener('click', () => {
      playSfx('tap');
      state.view = 'hub';

    });

    root.querySelectorAll('[data-start-act]').forEach(btn => {
      btn.addEventListener('click', () => {
        playSfx('tap');
        startActivity(Number(btn.getAttribute('data-start-act')));
      });
    });
  }

  // ==========================================
  // 7. GAME ENGINE & POSITIVE FEEDBACK HOLD
  // ==========================================
  function startActivity(actIdx) {
    state.view = 'game';
    state.currentActivityIndex = actIdx;
    const act = getCurrentActivity();
    state.sessionRounds = buildSessionRounds(act);
    state.sessionTraceResults = [];
    state.roundIndex = 0;
    initRoundState();
    render();
  }

  function initRoundState() {
    state.gameData = {
      roundSuccess: false,
      praiseText: '',
      hintActive: false,
      pickedIds: [],
      count: 0,
      paid: 0,
      hour: 12,
      cartIds: [],
      kioskMenu: null,
      kioskTemp: null,
      kioskPack: null,
      hasDrawn: false,
      traceDataUrl: '',
      readChunks: {},
      activeChunkIdx: -1
    };
    const promptText = getCurrentPromptText();
    if (promptText) speak(promptText);
  }

  function triggerRoundSuccess(customPraise) {
    const r = getCurrentRound();
    const praise = customPraise || (r && r.praise) || '정답이에요! 정말 잘했습니다!';
    state.gameData.roundSuccess = true;
    state.gameData.praiseText = praise;
    state.gameData.hintActive = false;
    playSfx('success');
    speak(praise);
    render();
  }

  function goToNextStep() {
    playSfx('tap');
    const total = state.sessionRounds.length;
    if (state.roundIndex + 1 < total) {
      state.roundIndex += 1;
      initRoundState();
      render();
    } else {
      const key = `${state.currentSubject}-${state.currentLevel}-${state.currentActivityIndex}`;
      if (!state.completedGames[key]) {
        state.stars += 3;
        state.completedGames[key] = true;
      } else {
        state.stars += 1;
      }
      saveProgress();
      state.view = 'complete';
      playSfx('fanfare');
      speak('정말 대단해요! 10단계 활동을 모두 마쳤습니다!');
      render();
    }
  }

  function handleGentleNudge(hintMessage) {
    playSfx('nudge');
    if (state.autoHintMode) {
      state.gameData.hintActive = true;
    }
    const msg = hintMessage || '다시 한 번 천천히 살펴볼까요?';
    showToast(msg, 'warn');
    speak(msg);
    render();
  }

  function renderGameShell() {
    const act = getCurrentActivity();
    const total = state.sessionRounds.length;
    const isLast = state.roundIndex + 1 >= total;

    root.innerHTML = `
      <section class="max-w-7xl w-full flex-1 mx-auto pop-in flex flex-col">
        <div class="bg-white rounded-3xl border-4 border-slate-200 shadow-sm p-5 lg:p-7 flex-1 flex flex-col justify-between gap-4">
          <div id="game-stage" class="flex-1 flex flex-col justify-between gap-5"></div>
          ${state.gameData.roundSuccess ? `
            <div class="pop-in bg-emerald-50 border-4 border-emerald-500 rounded-3xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <span class="text-5xl">🌟</span>
                <div>
                  <div class="text-sm font-black text-emerald-800">참 잘했어요!</div>
                  <div class="text-xl lg:text-2xl font-black text-slate-900">${state.gameData.praiseText}</div>
                </div>
              </div>
              <button id="btn-next-round" class="tap-target shrink-0 px-8 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl shadow-md transition">
                ${isLast ? '결과 보기 🏆' : '다음 문제로 →'}
              </button>
            </div>
          ` : ''}
        </div>
      </section>
    `;

    if (state.gameData.roundSuccess) {
      document.getElementById('btn-next-round').addEventListener('click', goToNextStep);
    }

    const stage = document.getElementById('game-stage');
    renderEngine(stage, act);
  }

  function renderEngine(stage, act) {
    switch (act.engine) {
      case 'readChunk': return renderReadChunkEngine(stage, act);
      case 'choice': return renderChoiceEngine(stage, act);
      case 'trace': return renderTraceEngine(stage, act);
      case 'sequence': return renderSequenceEngine(stage, act);
      case 'basket': return renderBasketEngine(stage, act);
      case 'payment': return renderPaymentEngine(stage, act);
      case 'clock': return renderClockEngine(stage, act);
      case 'budget': return renderBudgetEngine(stage, act);
      case 'kiosk': return renderKioskEngine(stage, act);
      case 'world3d': return renderWorld3DEngine(stage, act);
    }
  }

  // ==========================================
  // 8. REUSABLE INTERACTIVE ENGINES
  // ==========================================

  // --- ENGINE 0: STRUCTURED CHUNK READING ---
  function renderReadChunkEngine(stage, act) {
    const round = getCurrentRound();
    const disabled = state.gameData.roundSuccess;
    const chunks = round.chunks;
    const readMap = state.gameData.readChunks || {};
    const activeIdx = state.gameData.activeChunkIdx;
    const readCount = Object.keys(readMap).length;

    const colorStyles = {
      sky:     { card: 'border-sky-400 bg-sky-50',     badge: 'bg-sky-700 text-white' },
      amber:   { card: 'border-amber-400 bg-amber-50', badge: 'bg-amber-600 text-white' },
      teal:    { card: 'border-teal-500 bg-teal-50',   badge: 'bg-teal-700 text-white' },
      rose:    { card: 'border-rose-400 bg-rose-50',   badge: 'bg-rose-600 text-white' },
      violet:  { card: 'border-violet-400 bg-violet-50', badge: 'bg-violet-700 text-white' },
      emerald: { card: 'border-emerald-400 bg-emerald-50', badge: 'bg-emerald-700 text-white' }
    };

    const fullSentenceHtml = chunks.map((c, idx) => {
      const isActive = activeIdx === idx;
      return `<span class="inline-block px-2 py-0.5 rounded-xl transition ${isActive ? 'bg-amber-300 text-slate-950 scale-105' : ''}">${c.text}</span>`;
    }).join(' ');

    const colsClass = chunks.length <= 3 ? 'sm:grid-cols-3' : chunks.length <= 5 ? 'sm:grid-cols-5' : 'sm:grid-cols-3 lg:grid-cols-6';

    stage.innerHTML = `
      <div class="space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-xl lg:text-2xl font-black text-slate-900">${round.prompt}</h2>
          <span class="px-3 py-1 rounded-xl bg-slate-100 text-slate-700 text-sm font-black">읽은 칸: ${readCount} / ${chunks.length}</span>
        </div>

        <div class="bg-slate-900 text-white rounded-2xl p-4 lg:p-5 text-center shadow-inner">
          <div class="text-xs font-bold text-slate-300 mb-1">전체 문장</div>
          <div class="text-2xl lg:text-3xl font-black leading-relaxed tracking-wide">${fullSentenceHtml}</div>
        </div>
      </div>

      <div class="space-y-4 mt-auto">
        <div class="grid grid-cols-2 ${colsClass} gap-3">
          ${chunks.map((c, idx) => {
            const st = colorStyles[c.color] || colorStyles.sky;
            const isRead = !!readMap[idx];
            const isActive = activeIdx === idx;
            const isHint = !disabled && state.gameData.hintActive && !isRead;
            return `
              <button data-rchunk="${idx}" ${disabled ? 'disabled' : ''} class="tap-target p-3.5 lg:p-4 rounded-2xl border-4 flex flex-col items-center justify-between text-center gap-2 min-h-[145px] transition ${st.card} ${
                isActive ? 'ring-4 ring-amber-400 scale-[1.03]' : ''
              } ${isHint ? 'hint-pulse' : ''}">
                <div class="w-full flex items-center justify-between gap-1">
                  <span class="px-2 py-0.5 rounded-lg text-xs font-black ${st.badge}">${c.role}</span>
                  ${isRead ? '<span class="text-teal-700 font-black text-base">✓</span>' : '<span class="text-slate-300 text-sm">○</span>'}
                </div>
                ${renderVisual(c.emoji, 'text-3xl lg:text-4xl')}
                <span class="text-lg lg:text-xl font-black text-slate-950 break-keep">${c.text}</span>
              </button>
            `;
          }).join('')}
        </div>

        ${!disabled ? `
          <div class="flex flex-col sm:flex-row gap-3">
            <button id="btn-read-all-chunks" class="tap-target flex-1 py-4 px-6 rounded-2xl bg-sky-700 hover:bg-sky-800 text-white font-black text-lg lg:text-xl shadow-sm transition">
              🔊 전체 문장 천천히 이어서 듣기
            </button>
            <button id="btn-finish-reading" class="tap-target flex-1 py-4 px-6 rounded-2xl bg-orange-600 hover:bg-orange-700 text-white font-black text-lg lg:text-xl shadow-sm transition">
              다 읽었어요! ✓
            </button>
          </div>
        ` : ''}
      </div>
    `;

    if (!disabled) {
      stage.querySelectorAll('[data-rchunk]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-rchunk'));
          const c = chunks[idx];
          playSfx('tap');
          state.gameData.readChunks[idx] = true;
          state.gameData.activeChunkIdx = idx;
          state.gameData.hintActive = false;
          speak(`${c.role.split(' ')[0]}, ${c.text}`);
          render();
        });
      });

      document.getElementById('btn-read-all-chunks').addEventListener('click', () => {
        playSfx('tap');
        const fullText = chunks.map(c => c.text).join(' ');
        chunks.forEach((_, idx) => { state.gameData.readChunks[idx] = true; });
        state.gameData.activeChunkIdx = -1;
        speak(fullText);
        render();
      });

      document.getElementById('btn-finish-reading').addEventListener('click', () => {
        if (Object.keys(state.gameData.readChunks).length >= chunks.length) {
          triggerRoundSuccess();
        } else {
          handleGentleNudge('아직 누르지 않은 칸도 눌러서 끝까지 읽어 보세요!');
        }
      });
    }
  }

  // --- ENGINE 2: TRACE / DRAW CANVAS ---
  function renderTraceEngine(stage, act) {
    const round = getCurrentRound();
    const disabled = state.gameData.roundSuccess;

    stage.innerHTML = `
      <div class="bg-orange-50 border-2 border-orange-200 rounded-2xl p-4 lg:p-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl lg:text-3xl font-black text-slate-900 leading-snug">${round.prompt}</h2>
          <p class="text-base font-bold text-slate-600 mt-1">아래 네모 칸 안의 흐린 글자를 손가락이나 펜으로 따라 그려 보세요.</p>
        </div>
        <div class="px-5 py-2 rounded-2xl bg-white border-2 border-orange-300 text-3xl font-black text-orange-700">
          ${round.guide}
        </div>
      </div>

      <div class="mt-auto space-y-3">
        <div class="relative bg-slate-50 border-4 border-slate-300 rounded-3xl overflow-hidden h-[220px] lg:h-[250px] flex items-center justify-center">
          <div class="pointer-events-none select-none font-black text-slate-200 tracking-widest" style="font-size: 130px; line-height: 1;">
            ${round.guide}
          </div>
          <canvas id="trace-board" class="trace-canvas absolute inset-0 w-full h-full"></canvas>
          ${state.gameData.traceDataUrl ? `<img src="${state.gameData.traceDataUrl}" alt="학생이 따라 쓴 글자" class="absolute inset-0 w-full h-full pointer-events-none">` : ''}
        </div>
        ${disabled && state.gameData.traceDataUrl ? `
          <p class="text-center text-base font-black text-teal-800">내가 따라 쓴 글자예요</p>
        ` : ''}

        ${!disabled ? `
          <div class="flex gap-3">
            <button id="btn-clear-trace" class="tap-target px-6 py-4 rounded-2xl border-2 border-slate-300 bg-white hover:bg-slate-100 font-black text-lg text-slate-800">
              다시 지우기
            </button>
            <button id="btn-done-trace" class="tap-target flex-1 py-4 rounded-2xl bg-orange-600 hover:bg-orange-700 text-white font-black text-xl shadow-sm">
              다 그렸어요! ✓
            </button>
          </div>
        ` : ''}
      </div>
    `;

    const canvas = document.getElementById('trace-board');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      function sizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const cssW = rect.width || 600;
        const cssH = rect.height || 240;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(cssW * dpr);
        const h = Math.round(cssH * dpr);
        if (canvas.width === w && canvas.height === h) return;
        canvas.width = w;
        canvas.height = h;
        ctx.setTransform(w / cssW, 0, 0, h / cssH, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#0F766E';
      }
      sizeCanvas();
      requestAnimationFrame(sizeCanvas);

      let drawing = false;
      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - r.left, y: clientY - r.top };
      }
      function startDraw(e) {
        if (disabled) return;
        e.preventDefault();
        drawing = true;
        state.gameData.hasDrawn = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }
      function moveDraw(e) {
        if (!drawing || disabled) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }
      function endDraw() { drawing = false; }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', endDraw);

      const clearBtn = document.getElementById('btn-clear-trace');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          playSfx('tap');
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
          state.gameData.hasDrawn = false;
        });
      }
      const doneBtn = document.getElementById('btn-done-trace');
      if (doneBtn) {
        doneBtn.addEventListener('click', () => {
          if (state.gameData.hasDrawn) {
            const dataUrl = canvas.toDataURL('image/png');
            state.gameData.traceDataUrl = dataUrl;
            state.sessionTraceResults[state.roundIndex] = {
              guide: round.guide,
              prompt: round.prompt,
              dataUrl
            };
            triggerRoundSuccess();
          } else {
            handleGentleNudge('글자 위를 손가락으로 먼저 따라 그려 보세요!');
          }
        });
      }
    }
  }

  // --- ENGINE 3: SEQUENCE ---
  function renderSequenceEngine(stage, act) {
    const round = getCurrentRound();
    const disabled = state.gameData.roundSuccess;
    const picked = state.gameData.pickedIds;
    const nextExpected = round.answerIds[picked.length];

    stage.innerHTML = `
      <div class="space-y-3">
        <div class="flex items-center gap-4 bg-slate-50 border-2 border-slate-200 rounded-2xl p-4">
          <span class="text-5xl">${round.sceneEmoji}</span>
          <h2 class="text-2xl lg:text-3xl font-black text-slate-900 leading-snug">${round.prompt}</h2>
        </div>

        <div class="grid grid-cols-${round.answerIds.length} gap-3">
          ${round.answerIds.map((_, idx) => {
            const bId = picked[idx];
            const item = bId ? round.items.find(x => x.id === bId) : null;
            return `
              <div class="min-h-[84px] rounded-2xl border-4 ${item ? 'border-teal-600 bg-teal-50' : 'border-dashed border-slate-300 bg-slate-50'} p-2.5 flex flex-col items-center justify-center text-center">
                ${item
                  ? `<span class="text-2xl">${item.emoji}</span><span class="text-base font-black text-teal-950 mt-0.5">${item.text}</span>`
                  : `<span class="text-sm font-black text-slate-400">${idx + 1}단계</span>`
                }
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-${round.items.length} gap-3 mt-auto">
        ${round.items.map(it => {
          const used = picked.includes(it.id);
          const isHint = !disabled && state.gameData.hintActive && it.id === nextExpected;
          return `
            <button data-seq="${it.id}" ${used || disabled ? 'disabled' : ''} class="tap-target p-5 rounded-2xl border-4 flex flex-col items-center justify-center text-center gap-2 min-h-[125px] transition ${
              used ? 'opacity-30 bg-slate-100 border-slate-200' : 'bg-white border-slate-300 hover:border-teal-500 hover:bg-teal-50'
            } ${isHint ? 'hint-pulse' : ''}">
              <span class="text-4xl">${it.emoji}</span>
              <span class="text-lg font-black text-slate-900">${it.text}</span>
            </button>
          `;
        }).join('')}
      </div>
    `;

    if (!disabled) {
      stage.querySelectorAll('[data-seq]').forEach(b => b.addEventListener('click', () => {
        const id = b.getAttribute('data-seq');
        if (id === nextExpected) {
          playSfx('tap');
          const it = round.items.find(x => x.id === id);
          speak(it.text);
          state.gameData.pickedIds.push(id);
          state.gameData.hintActive = false;
          if (state.gameData.pickedIds.length === round.answerIds.length) {
            triggerRoundSuccess();
          } else {
            render();
          }
        } else {
          handleGentleNudge('첫 순서부터 차근차근 눌러 보세요!');
        }
      }));
    }
  }

  // --- ENGINE 4: BASKET ---
  function renderBasketEngine(stage, act) {
    const round = getCurrentRound();
    const disabled = state.gameData.roundSuccess;
    const count = state.gameData.count;
    const numWords = ['', '하나', '둘', '셋', '넷', '다섯', '여섯'];

    const basketItems = Array.from({ length: round.targetCount }, (_, i) => {
      const filled = i < count;
      return `
        <div class="w-20 h-20 lg:w-24 lg:h-24 rounded-2xl border-4 ${filled ? 'border-teal-600 bg-teal-50' : 'border-dashed border-slate-300 bg-white'} flex items-center justify-center text-4xl lg:text-5xl">
          ${filled ? round.itemEmoji : ''}
        </div>
      `;
    }).join('');

    stage.innerHTML = `
      <div class="space-y-4">
        <h2 class="text-2xl lg:text-3xl font-black text-slate-900 leading-snug">${round.prompt}</h2>
        <div class="bg-amber-50 border-4 border-amber-200 rounded-3xl p-5 flex flex-col items-center">
          <div class="text-xl font-black text-amber-950 mb-3">현재 담은 수: <span class="text-3xl text-teal-700">${count}</span> / ${round.targetCount}개</div>
          <div class="flex flex-wrap justify-center gap-3">${basketItems}</div>
        </div>
      </div>

      ${!disabled ? `
        <div class="mt-auto">
          <button id="btn-add-fruit" class="tap-target w-full py-6 px-8 rounded-3xl bg-teal-700 hover:bg-teal-800 text-white font-black text-2xl lg:text-3xl shadow-md flex items-center justify-center gap-4 transition ${state.gameData.hintActive ? 'hint-pulse' : ''}">
            <span class="text-5xl">${round.itemEmoji}</span>
            <span>${round.itemName} 1개 담기</span>
          </button>
        </div>
      ` : ''}
    `;

    const addBtn = document.getElementById('btn-add-fruit');

        if (state.gameData.count < round.targetCount) {
          playSfx('tap');
          state.gameData.count += 1;
          speak(numWords[state.gameData.count] || String(state.gameData.count));
          if (state.gameData.count === round.targetCount) {
            setTimeout(() => triggerRoundSuccess(), 550);
          } else {
            render();
          }
        }
      });
    }

  // --- ENGINE 6: CLOCK ---
  function renderClockEngine(stage, act) {
    const round = getCurrentRound();

          <span class="font-black text-2xl ${totalSpent > round.budget ? 'text-rose-700' : 'text-teal-800'}">

          </span>
        </div>
      </div>

              return `
                <button data-bitem="${it.id}" class="tap-target p-4 rounded-2xl border-4 flex flex-col items-center gap-1 transition ${
                  sel ? 'border-teal-700 bg-teal-50' : 'border-slate-300 bg-white'
                }">
                  <span class="text-5xl">${it.emoji}</span>
                  <span class="text-lg font-black">${it.name}</span>
                  <span class="text-sm font-bold text-slate-600">${it.price.toLocaleString()}원</span>

          <button id="btn-budget-ok" class="tap-target w-full py-4 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-black text-xl">장보기 완료하기</button>
        </div>
      ` : ''}
    `;

    if (!disabled) {
      stage.querySelectorAll('[data-bitem]').forEach(b => b.addEventListener('click', () => {
        playSfx('tap');
        const id = b.getAttribute('data-bitem');
        const idx = state.gameData.cartIds.indexOf(id);

      }
      return new THREE.CanvasTexture(c);

    welcomeMat.rotation.x = -Math.PI / 2;
    welcomeMat.position.set(0, 0.02, 4.6);
    scene.add(welcomeMat);

    const doorMat = new THREE.MeshLambertMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.65 });
    const doorL = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.2, 0.12), doorMat);
    doorL.position.set(-0.76, 1.6, 4.0);
    scene.add(doorL);
    const doorR = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.2, 0.12), doorMat);
    doorR.position.set(0.76, 1.6, 4.0);
    scene.add(doorR);

    // --- REALISTIC STACKED BASKETS (x=-3.6, z=1.2) ---
    const basketBase = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.25, 0.9), new THREE.MeshLambertMaterial({ color: 0x334155 }));
    basketBase.position.set(-3.8, 0.125, 1.2);
    scene.add(basketBase);

    const basketColors = [0xf97316, 0xfb923c, 0xf97316, 0xea580c];
    basketColors.forEach((col, idx) => {
      const bBody = new THREE.Mesh(
        new THREE.BoxGeometry(0.95, 0.28, 0.72),
        new THREE.MeshLambertMaterial({ color: col })
      );
      bBody.position.set(-3.8, 0.4 + idx * 0.22, 1.2);
      scene.add(bBody);
    });
    // Basket Handles on Top
    const handleMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    const hLeft = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.28, 0.55), handleMat);
    hLeft.position.set(-4.22, 1.22, 1.2);
    scene.add(hLeft);
    const hRight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.28, 0.55), handleMat);
    hRight.position.set(-3.38, 1.22, 1.2);
    scene.add(hRight);

    const basketSign = new THREE.Mesh(
      new THREE.PlaneGeometry(2.1, 0.55),
      new THREE.MeshBasicMaterial({ map: makeSignTexture('🧺 바구니 코너', '#ea580c', '#ffffff') })
    );
    basketSign.position.set(-3.8, 1.95, 1.2);
    basketSign.rotation.y = Math.PI / 4;
    scene.add(basketSign);

    // --- REALISTIC SNACK SHELF WITH EMOJI PACKS (x=-1.6, z=-4.8) ---
    const shelfFrame = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.5, 1.0), new THREE.MeshLambertMaterial({ color: 0xfef08a }));
    shelfFrame.position.set(-1.6, 1.25, -5.0);
    scene.add(shelfFrame);

    const snackTex = makeProductTexture('#fffbeb', ['🍪', '🍟', '🍫', '🥨', '🍿', '🍬'], 3, 3);
    const snackFront = new THREE.Mesh(
      new THREE.PlaneGeometry(2.6, 2.2),
      new THREE.MeshBasicMaterial({ map: snackTex })
    );
    snackFront.position.set(-1.6, 1.25, -4.48);
    scene.add(snackFront);

    // 3D Snack Boxes protruding on shelves
    [0xef4444, 0x3b82f6, 0xf59e0b, 0x10b981].forEach((c, i) => {
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.25), new THREE.MeshLambertMaterial({ color: c }));
      box.position.set(-2.4 + i * 0.55, 1.55, -4.4);
      scene.add(box);
    });

    const snackSign = new THREE.Mesh(
      new THREE.PlaneGeometry(2.5, 0.58),
      new THREE.MeshBasicMaterial({ map: makeSignTexture('🍪 과자 코너', '#b45309', '#ffffff') })
    );
    snackSign.position.set(-1.6, 2.9, -4.5);
    scene.add(snackSign);

    // --- REALISTIC DRINK & FOOD COOLER (x=1.6, z=-4.8) ---
    const fridgeFrame = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.7, 1.0), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
    fridgeFrame.position.set(1.6, 1.35, -5.0);
    scene.add(fridgeFrame);

    const foodTex = makeProductTexture('#e0f2fe', ['🥛', '🧃', '🥤', '🍙', '🥪', '🍦'], 3, 3);
    const fridgeFront = new THREE.Mesh(
      new THREE.PlaneGeometry(2.5, 2.3),
      new THREE.MeshBasicMaterial({ map: foodTex })
    );
    fridgeFront.position.set(1.6, 1.35, -4.48);
    scene.add(fridgeFront);

    const foodSign = new THREE.Mesh(
      new THREE.PlaneGeometry(2.5, 0.58),
      new THREE.MeshBasicMaterial({ map: makeSignTexture('🥛 식품 코너', '#0369a1', '#ffffff') })
    );
    foodSign.position.set(1.6, 3.05, -4.5);
    scene.add(foodSign);

    // --- CHECKOUT COUNTER + POS + CARD READER + CLERK (x=4.3, z=-1.4) ---
    const counter = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.15, 3.2), new THREE.MeshLambertMaterial({ color: 0x334155 }));
    counter.position.set(4.3, 0.575, -1.4);
    scene.add(counter);

    const posMonitor = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.45, 0.6), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
    posMonitor.position.set(4.0, 1.4, -1.1);
    scene.add(posMonitor);

    const cardReader = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.14, 0.22), new THREE.MeshLambertMaterial({ color: 0x0ea5e9 }));
    cardReader.position.set(3.75, 1.22, -1.9);
    scene.add(cardReader);

    const clerkHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshLambertMaterial({ color: 0xfde68a }));
    clerkHead.position.set(4.75, 1.85, -1.4);
    scene.add(clerkHead);
    const clerkBody = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.9, 12), new THREE.MeshLambertMaterial({ color: 0x0f766e }));
    clerkBody.position.set(4.75, 1.2, -1.4);
    scene.add(clerkBody);

    const counterSign = new THREE.Mesh(
      new THREE.PlaneGeometry(2.3, 0.58),
      new THREE.MeshBasicMaterial({ map: makeSignTexture('💳 계산대', '#1e293b', '#ffffff') })
    );
    counterSign.position.set(4.2, 2.65, -1.4);
    counterSign.rotation.y = -Math.PI / 2;
    scene.add(counterSign);

    const queueLine = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5, 0.35),
      new THREE.MeshBasicMaterial({ color: 0xfacc15 })
    );
    queueLine.rotation.x = -Math.PI / 2;
    queueLine.position.set(3.2, 0.03, 0.4);
    scene.add(queueLine);

    // Glowing Waypoint Ring on Floor
    const beaconRing = new THREE.Mesh(
      new THREE.RingGeometry(0.65, 0.95, 32),
      new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide })
    );
    beaconRing.rotation.x = -Math.PI / 2;
    beaconRing.position.y = 0.04;
    scene.add(beaconRing);

    // --- VIRTUAL JOYSTICK & KEYBOARD INPUT ---
    const joyBase = document.getElementById('w3d-joy-base');
    const joyKnob = document.getElementById('w3d-joy-knob');
    let joyInput = { x: 0, y: 0 };
    let joyDragging = false;
    const keys = {};

    function updateJoystick(clientX, clientY) {
      const rect = joyBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width / 2 - 22;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyInput.x = dx / maxR;
      joyInput.y = dy / maxR;
    }

    function resetJoystick() {
      joyDragging = false;
      joyInput = { x: 0, y: 0 };
      joyKnob.style.transform = 'translate(0px, 0px)';
    }

    function onJoyDown(e) {
      e.preventDefault();
      joyDragging = true;
      const pt = e.touches ? e.touches[0] : e;
      updateJoystick(pt.clientX, pt.clientY);
    }
    function onJoyMove(e) {
      if (!joyDragging) return;
      e.preventDefault();
      const pt = e.touches ? e.touches[0] : e;
      updateJoystick(pt.clientX, pt.clientY);
    }

    joyBase.addEventListener('mousedown', onJoyDown);
    window.addEventListener('mousemove', onJoyMove);
    window.addEventListener('mouseup', resetJoystick);
    joyBase.addEventListener('touchstart', onJoyDown, { passive: false });
    window.addEventListener('touchmove', onJoyMove, { passive: false });
    window.addEventListener('touchend', resetJoystick);

    function onKeyDown(e) { keys[e.key] = true; }
    function onKeyUp(e) { keys[e.key] = false; }
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    function onResize() {
      if (!vp.clientWidth || !vp.clientHeight) return;
      camera.aspect = vp.clientWidth / vp.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(vp.clientWidth, vp.clientHeight);
    }
    window.addEventListener('resize', onResize);

    // --- PROXIMITY CARD LOGIC ---
    let lastShownStep = -1;
    function syncActionCard() {
      if (w.step >= STEPS.length || disabled) {
        actionCard.classList.add('hidden');
        return;
      }
      const st = STEPS[w.step];
      const dist = Math.hypot(w.px - st.tx, w.pz - st.tz);
      if (dist <= st.nearDist) {
        if (lastShownStep !== w.step) {
          lastShownStep = w.step;
          actionCard.classList.remove('hidden');
          if (w.step === 2) {
            const msg2 = '과자 코너와 식품 코너에 왔어요! 어떤 물건을 바구니에 담을까요?';
            cardText.textContent = msg2;
            speak(msg2);
            cardBtns.innerHTML = `
              <button data-w3d-item="🍪 과자" class="tap-target px-5 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-lg">🍪 과자 담기</button>
              <button data-w3d-item="🥛 우유" class="tap-target px-5 py-3 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white font-black text-lg">🥛 우유 담기</button>
            `;
            cardBtns.querySelectorAll('[data-w3d-item]').forEach(b => b.addEventListener('click', () => {
              playSfx('success');
              w.pickedItem = b.getAttribute('data-w3d-item');
              speak(`${w.pickedItem}를 바구니에 담았어요! 이제 계산대 앞 노란 줄로 가세요.`);
              w.step = 3;
              lastShownStep = -1;
              actionCard.classList.add('hidden');
              updateHUD();
            }));
          } else {
            let cardMsg = st.guide;
            if (w.step === 0) cardMsg = '편의점 문 앞이에요! 문을 열고 들어가 인사해 볼까요?';
            if (w.step === 1) cardMsg = '바구니 코너에 왔어요! 장바구니를 들어 보세요.';
            if (w.step === 3) cardMsg = '계산대 앞 노란 줄에 왔어요! 차례를 기다려 볼까요?';
            if (w.step === 4) cardMsg = '계산대 앞이에요! 카드로 계산하고 감사 인사를 해 보세요.';
            cardText.textContent = cardMsg;
            speak(cardMsg);
            cardBtns.innerHTML = `
              <button id="w3d-do-step" class="tap-target px-6 py-3.5 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-black text-lg shadow-sm">${st.btn}</button>
            `;
            document.getElementById('w3d-do-step').addEventListener('click', () => {
              playSfx('success');
              if (w.step === 0) w.doorOpen = true;
              if (w.step === 1) w.hasBasket = true;
              speak(st.praise);
              w.step += 1;
              lastShownStep = -1;
              actionCard.classList.add('hidden');
              updateHUD();
              if (w.step >= STEPS.length) {
                triggerRoundSuccess();
              }
            });
          }
        }
      } else {
        if (lastShownStep !== -1) {
          lastShownStep = -1;
          actionCard.classList.add('hidden');
        }
      }
    }

    updateHUD();

    // --- ANIMATION LOOP ---
    let animId = null;
    let tick = 0;
    function animate() {
      animId = requestAnimationFrame(animate);
      tick += 0.05;

      // Combine joystick + keyboard
      let turn = joyInput.x;
      let move = -joyInput.y;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) turn = -0.8;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) turn = 0.8;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) move = 0.9;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) move = -0.8;

      w.yaw -= turn * 0.035;
      const speed = 0.095;
      const nx = w.px - Math.sin(w.yaw) * move * speed;
      const nz = w.pz - Math.cos(w.yaw) * move * speed;

      // Simple store wall collision (prevent walking through closed door or walls)
      const minZ = w.doorOpen ? -4.2 : 4.6;
      w.px = Math.max(-4.5, Math.min(4.5, nx));
      w.pz = Math.max(minZ, Math.min(8.5, nz));

      // Animate sliding glass doors
      const targetDoorOffset = w.doorOpen ? 1.45 : 0;
      doorL.position.x += ((-0.76 - targetDoorOffset) - doorL.position.x) * 0.1;
      doorR.position.x += ((0.76 + targetDoorOffset) - doorR.position.x) * 0.1;

      // Position glowing target beacon
      if (w.step < STEPS.length) {
        const st = STEPS[w.step];
        beaconRing.visible = true;
        beaconRing.position.x = st.tx;
        beaconRing.position.z = st.tz;
        const sc = 1 + Math.sin(tick * 2) * 0.12;
        beaconRing.scale.set(sc, sc, 1);
      } else {
        beaconRing.visible = false;
      }

      camera.position.set(w.px, 1.65, w.pz);
      camera.rotation.order = 'YXZ';
      camera.rotation.y = w.yaw;

      syncActionCard();
      renderer.render(scene, camera);
    }
    animate();

    world3DCleanup = () => {
      if (animId) cancelAnimationFrame(animId);
      window.removeEventListener('mousemove', onJoyMove);
      window.removeEventListener('mouseup', resetJoystick);
      window.removeEventListener('touchmove', onJoyMove);
      window.removeEventListener('touchend', resetJoystick);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
    };
  }

  // ==========================================
  // 9. COMPLETION VIEW
  // ==========================================
  function renderComplete() {
    const sub = SUBJECTS.find(x => x.id === state.currentSubject);
    const act = getCurrentActivity();
    root.innerHTML = `
      <section class="pop-in bg-white rounded-3xl border-4 border-amber-400 shadow-lg p-8 sm:p-12 text-center max-w-3xl w-full mx-auto my-auto flex flex-col justify-between gap-6">
        <div>
          <div class="text-8xl mb-4">🏆</div>
          <h1 class="text-4xl font-black text-slate-900 mb-3">정말 잘했어요!</h1>
          <p class="text-xl text-slate-700 mb-5">
            <strong>${sub.name} ${state.currentLevel}수준</strong> &lt;${act.title}&gt; 10단계를 모두 마쳤습니다.
          </p>
          <div class="inline-flex items-center gap-2 bg-amber-100 border-2 border-amber-300 px-8 py-4 rounded-2xl text-amber-950 font-black text-2xl">
            <span>⭐</span>
            <span>지금까지 모은 별: ${state.stars}개</span>
          </div>

          ${act.engine === 'trace' && (state.sessionTraceResults || []).some(r => r && r.dataUrl) ? `
            <div class="mt-7">
              <h2 class="text-2xl font-black text-slate-900 mb-3">🖍️ 내가 따라 쓴 글자</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                ${state.sessionTraceResults.map((r, i) => r && r.dataUrl ? `
                  <div class="bg-white border-4 border-teal-400 rounded-2xl overflow-hidden shadow-sm">
                    <div class="relative h-[110px] flex items-center justify-center bg-slate-50">
                      <div class="pointer-events-none select-none font-black text-slate-200" style="font-size: 64px; line-height: 1;">${r.guide}</div>
                      <img src="${r.dataUrl}" alt="${r.guide} 따라 쓴 글자" class="absolute inset-0 w-full h-full">
                    </div>
                    <div class="px-2 py-1.5 text-center text-base font-black text-teal-900 bg-teal-50">${i + 1}. ${r.guide}</div>
                  </div>
                ` : '').join('')}
              </div>
            </div>
          ` : ''}
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center mt-4">
          <button id="btn-retry-game" class="tap-target px-8 py-4 rounded-2xl border-4 border-slate-300 bg-white hover:bg-slate-50 font-black text-xl text-slate-900">
            새 문제로 다시 하기
          </button>
          <button id="btn-go-menu" class="tap-target px-8 py-4 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-black text-xl shadow-sm">
            ${sub.name} 다른 활동 고르기
          </button>
          <button id="btn-go-hub" class="tap-target px-8 py-4 rounded-2xl border-4 border-slate-300 bg-slate-100 hover:bg-slate-200 font-black text-xl text-slate-900">
            과목 화면으로
          </button>
        </div>
      </section>
    `;

    document.getElementById('btn-retry-game').addEventListener('click', () => {
      playSfx('tap');
      startActivity(state.currentActivityIndex);
    });
    document.getElementById('btn-go-menu').addEventListener('click', () => {
      playSfx('tap');
      state.view = 'subjectMenu';
      render();
    });
    document.getElementById('btn-go-hub').addEventListener('click', () => {
      playSfx('tap');
      state.view = 'hub';
      render();
    });
  }

  // ==========================================
  // 10. GLOBAL HEADER, DOCK & MODAL LISTENERS
  // ==========================================
  document.getElementById('btn-home').addEventListener('click', () => {
    playSfx('tap'); state.view = 'hub'; render();
  });
  document.getElementById('btn-back-hub').addEventListener('click', () => {
    playSfx('tap'); state.view = 'hub'; render();
  });
  document.getElementById('btn-back-menu').addEventListener('click', () => {
    playSfx('tap'); state.view = 'subjectMenu'; render();
  });
  document.getElementById('btn-replay-voice').addEventListener('click', () => {
    playSfx('tap'); speak(getCurrentPromptText());
  });
  document.getElementById('btn-show-hint').addEventListener('click', () => {
    playSfx('tap');
    state.gameData.hintActive = true;
    speak('반짝이는 칸을 눌러 보세요!');
    render();
  });

  document.getElementById('toggle-tts').addEventListener('click', () => {
    state.ttsEnabled = !state.ttsEnabled;
    if (!state.ttsEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    playSfx('tap'); render();
  });
  document.getElementById('toggle-sfx').addEventListener('click', () => {
    state.sfxEnabled = !state.sfxEnabled;
    if (state.sfxEnabled) playSfx('tap');
    render();
  });
  document.getElementById('toggle-teacher').addEventListener('click', () => {
    playSfx('tap'); document.getElementById('teacher-panel').classList.remove('hidden');
  });

  ['btn-close-teacher', 'btn-done-teacher'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      playSfx('tap'); document.getElementById('teacher-panel').classList.add('hidden');
    });
  });

  document.getElementById('opt-errorless').addEventListener('change', (e) => { state.errorlessMode = e.target.checked; });
  document.getElementById('opt-autohint').addEventListener('change', (e) => { state.autoHintMode = e.target.checked; });
  document.getElementById('opt-bigtext').addEventListener('change', (e) => { state.bigTextMode = e.target.checked; updateHeader(); });
  document.getElementById('btn-reset-progress').addEventListener('click', () => {
    state.stars = 0; state.completedGames = {}; saveProgress();
    showToast('학습 기록을 초기화했어요.'); render();
  });

  render();
})();
</script>
