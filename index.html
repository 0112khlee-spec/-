<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>함께 배움터 — 특수교육 통합 체험형 학습 앱</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #EEF2F5;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.45); }
      50% { transform: scale(1.025); box-shadow: 0 0 0 14px rgba(15, 118, 110, 0); }
    }
    .hint-pulse {
      animation: gentlePulse 1.3s infinite;
      border-color: #0F766E !important;
      background-color: #CCFBF1 !important;
    }
    @keyframes popIn {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: popIn 0.22s ease-out forwards;
    }
    .tap-target {
      min-height: 64px;
      touch-action: manipulation;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen lg:h-screen lg:overflow-hidden flex flex-col">

  <!-- 1. TOP BAR (Fixed non-overlapping flex zone, ~10-12% height) -->
  <header class="shrink-0 bg-white border-b-2 border-slate-200 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <button id="btn-home" class="tap-target flex items-center gap-3 px-3 py-1.5 rounded-2xl hover:bg-slate-100 transition text-left" title="처음 화면으로">
          <span class="w-11 h-11 rounded-2xl bg-teal-700 text-white flex items-center justify-center text-2xl font-black shadow-sm">배</span>
          <div>
            <div class="text-xl font-black tracking-tight text-slate-900 leading-tight">함께 배움터</div>
            <div class="text-xs font-bold text-slate-500">특수교육 통합 체험 학습</div>
          </div>
        </button>
      </div>

      <!-- Center Game Progress (Visible during game) -->
      <div id="top-game-status" class="hidden flex-1 max-w-md mx-4">
        <div class="flex items-center justify-between text-sm font-black text-slate-700 mb-1.5">
          <span id="top-badge" class="px-3 py-0.5 rounded-lg bg-teal-700 text-white text-xs"></span>
          <span id="top-step-label"></span>
        </div>
        <div class="w-full h-3.5 bg-slate-200 rounded-full overflow-hidden">
          <div id="top-progress-bar" class="h-full bg-teal-600 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Right Controls (Teacher & Audio) -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5 bg-amber-100 border-2 border-amber-300 px-3.5 py-2 rounded-2xl text-amber-950 font-black text-base">
          <span>⭐</span>
          <span>별</span>
          <span id="star-count" class="text-lg text-amber-800">0</span>
        </div>

        <button id="toggle-tts" class="tap-target px-3.5 py-2 rounded-2xl border-2 border-slate-300 bg-white hover:bg-slate-50 text-sm font-black flex items-center gap-1.5 transition" aria-pressed="true">
          <span id="tts-icon">🔊</span>
          <span id="tts-label">음성 켜짐</span>
        </button>

        <button id="toggle-sfx" class="tap-target px-3.5 py-2 rounded-2xl border-2 border-slate-300 bg-white hover:bg-slate-50 text-sm font-black flex items-center gap-1.5 transition" aria-pressed="true">
          <span id="sfx-icon">🎵</span>
          <span id="sfx-label">효과음</span>
        </button>

        <button id="toggle-teacher" class="tap-target px-4 py-2 rounded-2xl border-2 border-teal-700 bg-teal-50 text-teal-950 hover:bg-teal-100 text-sm font-black flex items-center gap-1.5 transition">
          <span>⚙️</span>
          <span>교사 설정</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. CENTER STAGE (Non-overlapping scrollable/centered flex-1 zone) -->
  <main id="app-root" class="flex-1 overflow-y-auto px-4 lg:px-8 py-3 lg:py-4 flex flex-col"></main>

  <!-- 3. BOTTOM ERGONOMIC STUDENT DOCK (Shown during game for easy whiteboard reach) -->
  <footer id="bottom-dock" class="hidden shrink-0 bg-white border-t-2 border-slate-200 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">

          <span>문제 다시 듣기</span>

          <span>💡</span>
          <span>힌트 보기</span>

    </div>

  <!-- Teacher Settings Modal (Clean overlay, never pushes layout) -->
  <div id="teacher-panel" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border-4 border-teal-700 max-w-xl w-full p-6 sm:p-8 shadow-2xl pop-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-2xl font-black text-slate-900">교사용 학생 맞춤 설정</h2>
          <p class="text-sm text-slate-600 mt-0.5">전자칠판 수업 중 학생 특성에 맞게 즉시 조절하세요.</p>
        </div>
        <button id="btn-close-teacher" class="tap-target px-4 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 font-black text-slate-800">
          닫기 ✕

      <div class="space-y-3 mb-6">

        <label class="flex items-center justify-between p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 cursor-pointer">

<script>
(function() {
  // ==========================================
  // 1. STATE & AUDIO / TTS ENGINE
  // ==========================================
  const state = {
    view: 'hub', // 'hub' | 'game' | 'complete'
    selectedLevel: 1,
    currentSubject: null,
    currentLevel: 1,
    roundIndex: 0,
    stars: 0,
    completedGames: {},
    ttsEnabled: true,
    sfxEnabled: true,
    errorlessMode: true,
    autoHintMode: true,
    bigTextMode: false,
    gameData: {}
  };

  try {
    const saved = localStorage.getItem('special_ed_app_v1');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (typeof parsed.stars === 'number') state.stars = parsed.stars;
      if (parsed.completedGames) state.completedGames = parsed.completedGames;
    }
  } catch (e) {}

  function saveProgress() {
    try {
      localStorage.setItem('special_ed_app_v1', JSON.stringify({
        stars: state.stars,
        completedGames: state.completedGames
      }));
    } catch (e) {}
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playSfx(type) {
    if (!state.sfxEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'success') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.09);
      osc.frequency.setValueAtTime(783.99, now + 0.18);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.46);
    } else if (type === 'tap') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.11);
    } else if (type === 'nudge') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(330, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.15, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.36);
      });
    }
  }

  function speak(text) {
    if (!state.ttsEnabled || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.92;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  let toastTimer = null;
  function showToast(msg, tone = 'dark') {
    const box = document.getElementById('toast-box');
    const el = document.getElementById('toast-msg');
    el.textContent = msg;
    el.className = 'px-7 py-4 rounded-2xl shadow-xl font-black text-xl flex items-center gap-2 border-2 border-white/20 ' +
      (tone === 'success' ? 'bg-teal-700 text-white' :
       tone === 'warn' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-white');
    box.classList.remove('opacity-0', '-translate-y-3');
    box.classList.add('opacity-100', 'translate-y-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      box.classList.add('opacity-0', '-translate-y-3');
      box.classList.remove('opacity-100', 'translate-y-0');
    }, 2000);
  }

        2: { title: '카페 음료 만들기 순서', desc: '작업 카드를 올바른 순서로 눌러 완성해요' },

  const LEVEL_INFO = {
    1: { name: '1수준 · 감각·기초', desc: '큰 그림 · 선택지 2개 · 즉시 안내' },
    2: { name: '2수준 · 생활·적용', desc: '일상 맥락 · 순서 배열 · 3~4개 선택' },

  // ==========================================

  // ==========================================

  const root = document.getElementById('app-root');

  function updateHeader() {
    document.getElementById('star-count').textContent = state.stars;
    document.body.classList.toggle('text-lg', state.bigTextMode);

    const ttsBtn = document.getElementById('toggle-tts');
    document.getElementById('tts-icon').textContent = state.ttsEnabled ? '🔊' : '🔇';
    document.getElementById('tts-label').textContent = state.ttsEnabled ? '음성 켜짐' : '음성 꺼짐';
    ttsBtn.setAttribute('aria-pressed', String(state.ttsEnabled));

    const sfxBtn = document.getElementById('toggle-sfx');
    document.getElementById('sfx-icon').textContent = state.sfxEnabled ? '🎵' : '🔕';
    document.getElementById('sfx-label').textContent = state.sfxEnabled ? '효과음' : '무음';
    sfxBtn.setAttribute('aria-pressed', String(state.sfxEnabled));

    if (state.view === 'game') {
      const sub = SUBJECTS.find(x => x.id === state.currentSubject);
      const total = getTotalRounds();
      const pct = Math.round(((state.roundIndex + 1) / total) * 100);
      topStatus.classList.remove('hidden');
      bottomDock.classList.remove('hidden');
      document.getElementById('top-badge').textContent = `${sub.name} · ${state.currentLevel}수준`;
      document.getElementById('top-step-label').textContent = `${state.roundIndex + 1} / ${total} 단계`;
      document.getElementById('top-progress-bar').style.width = `${pct}%`;
    } else {
      topStatus.classList.add('hidden');
      bottomDock.classList.add('hidden');
    }
  }

  function render() {
    updateHeader();
    if (state.view === 'hub') {
      renderHub();
    } else if (state.view === 'game') {
      renderGameShell();
    } else if (state.view === 'complete') {
      renderComplete();
    }
  }

  // ==========================================
  // 6. GAME ENGINE & WIDESCREEN STAGE
  // ==========================================
  function startGame(subjectId, level) {
    state.view = 'game';
    state.currentSubject = subjectId;
    state.currentLevel = level;
    state.roundIndex = 0;
    initRoundState();
    render();
  }

  function getTotalRounds() {
    const key = `${state.currentSubject}-${state.currentLevel}`;
    const map = {
      'korean-1': KOREAN_L1_ROUNDS.length,
      'korean-2': KOREAN_L2_ROUNDS.length,
      'korean-3': KOREAN_L3_ROUNDS.length,
      'math-1': MATH_L1_ROUNDS.length,
      'math-2': MATH_L2_ROUNDS.length,
      'math-3': MATH_L3_ROUNDS.length,
      'social-1': SOCIAL_L1_ROUNDS.length,
      'social-2': SOCIAL_L2_ROUNDS.length,
      'social-3': SOCIAL_L3_ROUNDS.length,
      'career-1': CAREER_L1_ROUNDS.length,
      'career-2': CAREER_L2_ROUNDS.length,
      'career-3': CAREER_L3_ROUNDS.length
    };
    return map[key] || 1;
  }

  function initRoundState() {
    state.gameData = {
      hintActive: false,
      pickedIds: [],
      count: 0,
      paid: 0,
      hour: 12,
      min: 0,
      cartIds: [],
      kioskMenu: null,
      kioskTemp: null,
      kioskPack: null
    };
    const promptText = getCurrentPromptText();
    if (promptText) speak(promptText);
  }

  function getCurrentPromptText() {
    const { currentSubject: s, currentLevel: l, roundIndex: r } = state;
    if (s === 'korean' && l === 1) return KOREAN_L1_ROUNDS[r].prompt;
    if (s === 'korean' && l === 2) return KOREAN_L2_ROUNDS[r].prompt;
    if (s === 'korean' && l === 3) return KOREAN_L3_ROUNDS[r].mission;
    if (s === 'math' && l === 1) return MATH_L1_ROUNDS[r].prompt;
    if (s === 'math' && l === 2) return MATH_L2_ROUNDS[r].prompt;
    if (s === 'math' && l === 3) return MATH_L3_ROUNDS[r].prompt;
    if (s === 'social' && l === 1) return SOCIAL_L1_ROUNDS[r].prompt;
    if (s === 'social' && l === 2) return SOCIAL_L2_ROUNDS[r].prompt;
    if (s === 'social' && l === 3) return SOCIAL_L3_ROUNDS[r].prompt;
    if (s === 'career' && l === 1) return CAREER_L1_ROUNDS[r].prompt;
    if (s === 'career' && l === 2) return CAREER_L2_ROUNDS[r].prompt;
    if (s === 'career' && l === 3) return CAREER_L3_ROUNDS[r].prompt;
    return '';
  }

  function advanceRound() {
    playSfx('success');
    showToast('잘했어요! 다음 문제로 넘어가요 ⭐', 'success');
    const total = getTotalRounds();
    setTimeout(() => {
      if (state.roundIndex + 1 < total) {
        state.roundIndex += 1;
        initRoundState();
        render();
      } else {
        const key = `${state.currentSubject}-${state.currentLevel}`;
        if (!state.completedGames[key]) {
          state.stars += 3;
          state.completedGames[key] = true;
          saveProgress();
        } else {
          state.stars += 1;
          saveProgress();
        }
        state.view = 'complete';
        playSfx('fanfare');
        speak('정말 잘했어요! 이번 활동을 모두 마쳤습니다!');
        render();
      }
    }, 900);
  }

  function handleGentleNudge(hintMessage) {
    playSfx('nudge');
    if (state.autoHintMode) {
      state.gameData.hintActive = true;
    }
    const msg = hintMessage || '다시 한 번 천천히 살펴볼까요?';
    showToast(msg, 'warn');
    speak(msg);
    render();
  }

  function renderGameShell() {
    const sub = SUBJECTS.find(x => x.id === state.currentSubject);
    const gameMeta = sub.games[state.currentLevel];

    root.innerHTML = `
      <section class="max-w-7xl w-full mx-auto my-auto pop-in">
        <div class="bg-white rounded-3xl border-4 border-slate-200 shadow-sm p-6 lg:p-10">
          <div class="text-sm font-black text-teal-700 mb-2">${sub.name} ${state.currentLevel}수준 · ${gameMeta.title}</div>
          <div id="game-stage"></div>
        </div>
      </section>
    `;

    const stage = document.getElementById('game-stage');
    renderCurrentGameStage(stage);
  }

  function renderCurrentGameStage(stage) {
    const key = `${state.currentSubject}-${state.currentLevel}`;
    switch (key) {
      case 'korean-1': return renderKoreanL1(stage);
      case 'korean-2': return renderKoreanL2(stage);
      case 'korean-3': return renderKoreanL3(stage);
      case 'math-1': return renderMathL1(stage);
      case 'math-2': return renderMathL2(stage);
      case 'math-3': return renderMathL3(stage);
      case 'social-1': return renderSocialL1(stage);
      case 'social-2': return renderSocialL2(stage);
      case 'social-3': return renderSocialL3(stage);
      case 'career-1': return renderCareerL1(stage);
      case 'career-2': return renderCareerL2(stage);
      case 'career-3': return renderCareerL3(stage);
    }
  }

  // --- KOREAN 2 ---
  function renderKoreanL2(stage) {
    const round = KOREAN_L2_ROUNDS[state.roundIndex];
    const picked = state.gameData.pickedIds;
    const nextExpectedId = round.answerIds[picked.length];

    const slotsHtml = round.answerIds.map((_, idx) => {
      const bId = picked[idx];
      const block = bId ? round.blocks.find(b => b.id === bId) : null;
      return `
        <div class="min-h-[96px] rounded-2xl border-4 ${block ? 'border-teal-600 bg-teal-50' : 'border-dashed border-slate-300 bg-slate-50'} flex flex-col items-center justify-center p-3">
          ${block
            ? `<span class="text-3xl">${block.emoji}</span><span class="text-lg font-black text-teal-950 mt-1">${block.text}</span>`
            : `<span class="text-base font-black text-slate-400">${idx + 1}번째 말</span>`
          }
        </div>
      `;
    }).join('');

    stage.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-5 bg-orange-50 border-4 border-orange-200 rounded-3xl p-6">
          <div class="text-6xl mb-3">${round.sceneEmoji}</div>
          <h2 class="text-2xl lg:text-3xl font-black text-slate-900 leading-snug">${round.prompt}</h2>
        </div>

        <div class="lg:col-span-7 space-y-6">
          <div class="grid grid-cols-3 gap-3">${slotsHtml}</div>
          <div>
            <div class="text-sm font-black text-slate-500 mb-2">아래 카드를 순서대로 터치하세요:</div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              ${round.blocks.map(b => {
                const used = picked.includes(b.id);
                const isHint = state.gameData.hintActive && b.id === nextExpectedId;
                return `
                  <button data-block="${b.id}" ${used ? 'disabled' : ''} class="tap-target p-5 rounded-2xl border-4 transition flex flex-col items-center justify-center gap-2 ${
                    used ? 'opacity-30 bg-slate-100 border-slate-200' : 'bg-white border-slate-300 hover:border-orange-500 hover:bg-orange-50'
                  } ${isHint ? 'hint-pulse' : ''}">
                    <span class="text-4xl">${b.emoji}</span>
                    <span class="text-xl font-black text-slate-900">${b.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    `;

    stage.querySelectorAll('[data-block]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-block');
        if (id === nextExpectedId) {
          playSfx('tap');
          const b = round.blocks.find(x => x.id === id);
          speak(b.text);
          state.gameData.pickedIds.push(id);
          state.gameData.hintActive = false;
          if (state.gameData.pickedIds.length === round.answerIds.length) {
            const fullSentence = round.answerIds.map(aid => round.blocks.find(x => x.id === aid).text).join(' ');
            setTimeout(() => speak(fullSentence), 400);
            advanceRound();
          } else {
            render();
          }
        } else {
          handleGentleNudge('문장의 첫 번째 말부터 순서대로 눌러 보세요!');
        }
      });
    });
  }

    stage.querySelectorAll('[data-kmenu]').forEach(b => b.addEventListener('click', () => {

    }));

      if (gd.kioskMenu === round.targetMenu && gd.kioskTemp === round.targetTemp && gd.kioskPack === round.targetPack) {
        speak('주문이 정확하게 완료되었어요!');
        advanceRound();
      } else {
        handleGentleNudge('미션에 적힌 메뉴, 온도, 포장 방법을 다시 확인해 보세요!');

  // --- MATH 1 ---
  function renderMathL1(stage) {
    const round = MATH_L1_ROUNDS[state.roundIndex];
    const count = state.gameData.count;
    const numWords = ['', '하나', '둘', '셋', '넷', '다섯'];

    const basketItems = Array.from({ length: round.targetCount }, (_, i) => {
      const filled = i < count;
      return `
        <div class="w-24 h-24 rounded-2xl border-4 ${filled ? 'border-teal-600 bg-teal-50' : 'border-dashed border-slate-300 bg-white'} flex items-center justify-center text-5xl">
          ${filled ? round.itemEmoji : ''}
        </div>
      `;
    }).join('');

    stage.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-5">
          <h2 class="text-3xl lg:text-4xl font-black text-slate-900 leading-snug mb-3">${round.prompt}</h2>

          <button id="btn-add-fruit" class="tap-target w-full py-6 px-8 rounded-3xl bg-teal-700 hover:bg-teal-800 text-white font-black text-2xl shadow-md flex items-center justify-center gap-4 transition ${state.gameData.hintActive ? 'hint-pulse' : ''}">

          </button>
        </div>

        <div class="lg:col-span-7 bg-amber-50 border-4 border-amber-200 rounded-3xl p-8 flex flex-col items-center">
          <div class="text-xl font-black text-amber-950 mb-4">현재 담은 수: <span class="text-3xl text-teal-700">${count}</span> / ${round.targetCount}개</div>
          <div class="flex flex-wrap justify-center gap-4">${basketItems}</div>
        </div>
      </div>
    `;

    document.getElementById('btn-add-fruit').addEventListener('click', () => {
      if (state.gameData.count < round.targetCount) {
        playSfx('tap');
        state.gameData.count += 1;
        speak(numWords[state.gameData.count] || String(state.gameData.count));
        if (state.gameData.count === round.targetCount) {
          render();

            speak(`${round.targetCount}개를 모두 담았어요!`);

    const coins = [
      { val: 1000, label: '1,000원 지폐', style: 'bg-sky-100 border-sky-500 text-sky-950' },
      { val: 500, label: '500원 동전', style: 'bg-amber-100 border-amber-500 text-amber-950' },
      { val: 100, label: '100원 동전', style: 'bg-slate-100 border-slate-400 text-slate-900' }
    ];

    stage.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-5 space-y-4">

        advanceRound();

      } else {
        handleGentleNudge('금액이 조금 넘쳤어요. 다시 내기를 눌러 맞춰 볼까요?');
      }
    });
  }

  function renderMathL3(stage) {
    const round = MATH_L3_ROUNDS[state.roundIndex];

          handleGentleNudge('3,000원을 넘었어요! 더 저렴한 간식을 골라 볼까요?');

      });

    stage.querySelectorAll('[data-spick]').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('data-spick') === round.target) {
        speak('안전한 행동을 잘 골랐어요!');
        advanceRound();
      } else {
        handleGentleNudge('안전하게 지킬 수 있는 행동을 다시 골라 보세요!');
      }
    }));
  }

  // --- CHOICE SCENARIO RENDERER (SOCIAL 2/3 & CAREER 1/3) ---
  function renderChoiceScenario(stage, round, accentClass) {
    stage.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-5 space-y-4">
          ${round.stepTitle ? `<div class="inline-block px-3 py-1 rounded-xl bg-sky-100 text-sky-900 text-sm font-black">${round.stepTitle}</div>` : ''}
          ${round.toolEmoji ? `
            <div class="flex items-center gap-4 bg-violet-50 border-4 border-violet-200 p-5 rounded-3xl">
              <span class="text-6xl">${round.toolEmoji}</span>
              <div>
                <div class="text-sm font-black text-violet-700">작업 도구</div>
                <div class="text-2xl font-black text-slate-900">${round.toolName}</div>
              </div>
            </div>
          ` : ''}
          <h2 class="text-2xl lg:text-3xl font-black text-slate-900 leading-snug">${round.prompt}</h2>
        </div>

        <div class="lg:col-span-7 grid grid-cols-1 sm:grid-cols-${round.options.length === 2 ? '2' : '3'} gap-4">
          ${round.options.map(opt => {
            const isHint = state.gameData.hintActive && opt.id === round.target;
            return `
              <button data-cpick="${opt.id}" class="tap-target p-6 rounded-3xl border-4 border-slate-300 bg-white hover:${accentClass} flex flex-col items-center text-center justify-center gap-3 min-h-[210px] transition ${isHint ? 'hint-pulse' : ''}">
                <span class="text-7xl">${opt.emoji}</span>
                <span class="text-xl font-black text-slate-900">${opt.label}</span>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;
    stage.querySelectorAll('[data-cpick]').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('data-cpick') === round.target) {
        speak('정답입니다! 참 잘했어요.');
        advanceRound();
      } else {
        handleGentleNudge('질문을 다시 한 번 들어보고 골라 볼까요?');
      }
    }));
  }

  function renderSocialL2(stage) { renderChoiceScenario(stage, SOCIAL_L2_ROUNDS[state.roundIndex], 'border-sky-500 bg-sky-50'); }
  function renderSocialL3(stage) { renderChoiceScenario(stage, SOCIAL_L3_ROUNDS[state.roundIndex], 'border-sky-500 bg-sky-50'); }
  function renderCareerL1(stage) { renderChoiceScenario(stage, CAREER_L1_ROUNDS[state.roundIndex], 'border-violet-500 bg-violet-50'); }
  function renderCareerL3(stage) { renderChoiceScenario(stage, CAREER_L3_ROUNDS[state.roundIndex], 'border-violet-500 bg-violet-50'); }

  // --- CAREER 2 ---
  function renderCareerL2(stage) {
    const round = CAREER_L2_ROUNDS[state.roundIndex];
    const picked = state.gameData.pickedIds;
    const nextExpected = round.answerIds[picked.length];

    stage.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        <div class="lg:col-span-5">
          <div class="inline-block px-3 py-1 rounded-xl bg-violet-100 text-violet-900 text-sm font-black mb-3">${round.title}</div>
          <h2 class="text-2xl lg:text-3xl font-black text-slate-900 leading-snug">${round.prompt}</h2>
        </div>

        <div class="lg:col-span-7 space-y-5">
          <div class="grid grid-cols-2 sm:grid-cols-${round.answerIds.length} gap-3">
            ${round.answerIds.map((_, idx) => {
              const sId = picked[idx];
              const step = sId ? round.steps.find(x => x.id === sId) : null;
              return `
                <div class="min-h-[96px] rounded-2xl border-4 ${step ? 'border-violet-600 bg-violet-50' : 'border-dashed border-slate-300 bg-slate-50'} p-3 flex flex-col items-center justify-center text-center">
                  ${step
                    ? `<span class="text-3xl">${step.emoji}</span><span class="text-base font-black text-violet-950 mt-1">${step.text}</span>`
                    : `<span class="text-base font-black text-slate-400">${idx + 1}단계</span>`
                  }
                </div>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${round.steps.map(st => {
              const used = picked.includes(st.id);
              const isHint = state.gameData.hintActive && st.id === nextExpected;
              return `
                <button data-cstep="${st.id}" ${used ? 'disabled' : ''} class="tap-target p-5 rounded-2xl border-4 flex items-center gap-3 transition ${
                  used ? 'opacity-30 bg-slate-100 border-slate-200' : 'bg-white border-slate-300 hover:border-violet-500 hover:bg-violet-50'
                } ${isHint ? 'hint-pulse' : ''}">
                  <span class="text-4xl">${st.emoji}</span>
                  <span class="text-lg font-black text-slate-900">${st.text}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;

    stage.querySelectorAll('[data-cstep]').forEach(b => b.addEventListener('click', () => {
      const id = b.getAttribute('data-cstep');
      if (id === nextExpected) {
        playSfx('tap');
        const st = round.steps.find(x => x.id === id);
        speak(st.text);
        state.gameData.pickedIds.push(id);
        state.gameData.hintActive = false;
        if (state.gameData.pickedIds.length === round.answerIds.length) {
          advanceRound();
        } else {
          render();
        }
      } else {
        handleGentleNudge('작업의 첫 순서부터 차근차근 눌러 보세요!');
      }
    }));
  }

  // ==========================================
  // 8. COMPLETION CELEBRATION VIEW
  // ==========================================
  function renderComplete() {
    const sub = SUBJECTS.find(x => x.id === state.currentSubject);
    const gameMeta = sub.games[state.currentLevel];
    root.innerHTML = `
      <section class="pop-in bg-white rounded-3xl border-4 border-amber-400 shadow-lg p-10 sm:p-14 text-center max-w-3xl w-full mx-auto">
        <div class="text-8xl mb-4">🏆</div>
        <h1 class="text-4xl font-black text-slate-900 mb-3">정말 잘했어요!</h1>
        <p class="text-xl text-slate-700 mb-6">
          <strong>${sub.name} ${state.currentLevel}수준</strong> &lt;${gameMeta.title}&gt; 활동을 모두 마쳤습니다.
        </p>

        <div class="inline-flex items-center gap-2 bg-amber-100 border-2 border-amber-300 px-8 py-4 rounded-2xl text-amber-950 font-black text-2xl mb-8">
          <span>⭐</span>
          <span>지금까지 모은 별: ${state.stars}개</span>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <button id="btn-retry-game" class="tap-target px-8 py-4 rounded-2xl border-4 border-slate-300 bg-white hover:bg-slate-50 font-black text-xl text-slate-900">
            한 번 더 하기
          </button>
          <button id="btn-go-hub" class="tap-target px-10 py-4 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-black text-xl shadow-sm">
            다른 과목 고르기
          </button>
        </div>
      </section>
    `;

    document.getElementById('btn-retry-game').addEventListener('click', () => {
      playSfx('tap');
      startGame(state.currentSubject, state.currentLevel);
    });
    document.getElementById('btn-go-hub').addEventListener('click', () => {
      playSfx('tap');
      state.view = 'hub';
      render();
    });
  }

  // ==========================================
  // 9. GLOBAL HEADER, DOCK & MODAL LISTENERS
  // ==========================================
  document.getElementById('btn-home').addEventListener('click', () => {
    playSfx('tap');
    state.view = 'hub';
    render();
  });

  document.getElementById('btn-back-hub').addEventListener('click', () => {
    playSfx('tap');
    state.view = 'hub';
    render();
  });

  document.getElementById('btn-replay-voice').addEventListener('click', () => {
    playSfx('tap');
    speak(getCurrentPromptText());
  });

  document.getElementById('btn-show-hint').addEventListener('click', () => {
    playSfx('tap');
    state.gameData.hintActive = true;
    speak('반짝이는 칸을 눌러 보세요!');
    render();
  });

  document.getElementById('toggle-tts').addEventListener('click', () => {
    state.ttsEnabled = !state.ttsEnabled;
    if (!state.ttsEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    playSfx('tap');
    render();
  });

  document.getElementById('toggle-sfx').addEventListener('click', () => {
    state.sfxEnabled = !state.sfxEnabled;
    if (state.sfxEnabled) playSfx('tap');
    render();
  });

  document.getElementById('toggle-teacher').addEventListener('click', () => {
    playSfx('tap');
    document.getElementById('teacher-panel').classList.remove('hidden');
  });

  ['btn-close-teacher', 'btn-done-teacher'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      playSfx('tap');
      document.getElementById('teacher-panel').classList.add('hidden');
    });
  });

  document.getElementById('opt-errorless').addEventListener('change', (e) => {
    state.errorlessMode = e.target.checked;
  });
  document.getElementById('opt-autohint').addEventListener('change', (e) => {
    state.autoHintMode = e.target.checked;
  });
  document.getElementById('opt-bigtext').addEventListener('change', (e) => {
    state.bigTextMode = e.target.checked;
    updateHeader();
  });
  document.getElementById('btn-reset-progress').addEventListener('click', () => {
    state.stars = 0;
    state.completedGames = {};
    saveProgress();
    showToast('학습 기록을 초기화했어요.');
    render();
  });

  // Boot
  render();
})();
</script>
</body>
</html>
